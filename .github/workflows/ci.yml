name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src/
          ruff format --check src/

      - name: Run MVP tests
        run: pytest -m mvp --tb=short -v --junitxml=reports/junit.xml

      - name: Coverage check
        run: |
          pytest -m mvp --cov=src --cov-report=term-missing \
            --cov-report=xml:reports/coverage.xml --cov-fail-under=90

      - name: Mutation testing (schemas + recipes)
        run: |
          mutmut run --paths-to-mutate src/schemas/ --no-progress || true
          mutmut run --paths-to-mutate src/recipes/ --no-progress || true
          mutmut results > reports/mutmut-results.txt
          cat reports/mutmut-results.txt

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.sha }}
          path: reports/
          retention-days: 30
